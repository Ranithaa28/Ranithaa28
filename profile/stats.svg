<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1BFFFF"/>
      <stop offset="100%" stop-color="#2E3192"/>
    </linearGradient>
  </defs>

<style>
@keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.row { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; }
.title { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }
</style>
<rect width="420" height="200" rx="14" fill="url(#borderGrad)"/>
<rect x="2" y="2" width="416" height="196" rx="12" fill="url(#bgGrad)"/>
<text class="title" x="24" y="36" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#1BFFFF">📊 GitHub Stats</text>
<g class="row" style="animation-delay:0.15s">
<text x="24" y="74" font-family="Segoe UI, sans-serif" font-size="15">⭐</text>
<text x="48" y="74" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b949e">Total Stars</text>
