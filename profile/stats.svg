<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#0d1117;#12182a;#161b28;#101a2b;#0d1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#161b28;#1a2440;#1c1030;#161b28" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#1BFFFF;#A855F7;#F78166;#3FB950;#58A6FF;#1BFFFF" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#2E3192;#1BFFFF;#A855F7;#F78166;#2E3192" dur="12s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

<style>
@keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.row { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; }
.title { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }
</style>
<rect width="420" height="200" rx="14" fill="url(#borderGrad)"/>
<rect x="2" y="2" width="416" height="196" rx="12" fill="url(#bgGrad)"/>
<text class="title" x="24" y="36" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#1BFFFF">📊 GitHub Stats</text>
<g class="row" style="animation-delay:0.15s">
<text x="24" y="74" font-family="Segoe UI, sans-serif" font-size="15">⭐</text>
<text x="48" y="74" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b949e">Total Stars</text>
<text x="396" y="74" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="end">0</text>
</g>
<g class="row" style="animation-delay:0.27s">
<text x="24" y="104" font-family="Segoe UI, sans-serif" font-size="15">📦</text>
<text x="48" y="104" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b949e">Public Repos</text>
<text x="396" y="104" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="end">11</text>
</g>
<g class="row" style="animation-delay:0.39s">
<text x="24" y="134" font-family="Segoe UI, sans-serif" font-size="15">👥</text>
<text x="48" y="134" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b949e">Followers</text>
<text x="396" y="134" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="end">1</text>
</g>
<g class="row" style="animation-delay:0.51s">
<text x="24" y="164" font-family="Segoe UI, sans-serif" font-size="15">🔥</text>
<text x="48" y="164" font-family="Segoe UI, sans-serif" font-size="14" fill="#8b949e">Total Contributions</text>
<text x="396" y="164" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="end">139</text>
</g>
</svg>