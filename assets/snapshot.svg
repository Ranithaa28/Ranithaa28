<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1BFFFF"/>
      <stop offset="100%" stop-color="#2E3192"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .row { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; }
    .title { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }
  </style>

  <rect width="900" height="430" rx="16" fill="url(#borderGrad)"/>
  <rect x="2" y="2" width="896" height="426" rx="14" fill="url(#bgGrad)"/>

  <text class="title" x="32" y="46" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1BFFFF">📌 Snapshot</text>
  <line x1="32" y1="60" x2="868" y2="60" stroke="#30363d"/>

  <!-- Row 1: Education -->
  <g class="row" style="animation-delay:0.10s">
    <circle cx="52" cy="96" r="18" fill="#1c2540"/>
    <text x="52" y="102" font-size="17" text-anchor="middle">🎓</text>
    <text x="86" y="90" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Education</text>
    <text x="86" y="110" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">B.E. Artificial Intelligence &amp; Machine Learning — VSB Engineering College</text>
    <text x="86" y="128" font-family="Segoe UI, sans-serif" font-size="13.5" font-style="italic" fill="#6e7681">2023–2027 &#8202;·&#8202; CGPA 8.41</text>
  </g>
  <line x1="32" y1="146" x2="868" y2="146" stroke="#21262d"/>

  <!-- Row 2: Focus -->
  <g class="row" style="animation-delay:0.20s">
    <circle cx="52" cy="176" r="18" fill="#2a1c40"/>
    <text x="52" y="182" font-size="17" text-anchor="middle">🧭</text>
    <text x="86" y="170" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Focus</text>
    <text x="86" y="190" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Full-stack development (Java + React ecosystem)</text>
    <text x="86" y="208" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">with applied Machine Learning</text>
  </g>
  <line x1="32" y1="226" x2="868" y2="226" stroke="#21262d"/>

  <!-- Row 3: Internships -->
  <g class="row" style="animation-delay:0.30s">
    <circle cx="52" cy="252" r="18" fill="#1c3a2e"/>
    <text x="52" y="258" font-size="17" text-anchor="middle">🏢</text>
    <text x="86" y="246" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Internships</text>
    <text x="86" y="266" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Infosys Internship 5.0 &#8202;·&#8202; ServiceNow University</text>
  </g>
  <line x1="32" y1="284" x2="868" y2="284" stroke="#21262d"/>

  <!-- Row 4: Building now -->
  <g class="row" style="animation-delay:0.40s">
    <circle cx="52" cy="314" r="18" fill="#3a2e1c"/>
    <text x="52" y="320" font-size="17" text-anchor="middle">🌱</text>
    <text x="86" y="308" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Building Now</text>
    <text x="86" y="328" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">MarketMind — an AI startup-validation SaaS</text>
    <text x="86" y="346" font-family="Segoe UI, sans-serif" font-size="13.5" font-style="italic" fill="#6e7681">LangGraph + FastAPI + Next.js</text>
  </g>
  <line x1="32" y1="364" x2="868" y2="364" stroke="#21262d"/>

  <!-- Row 5: Looking for -->
  <g class="row" style="animation-delay:0.50s">
    <circle cx="52" cy="394" r="18" fill="#3a1c2e"/>
    <text x="52" y="400" font-size="17" text-anchor="middle">🎯</text>
    <text x="86" y="388" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Looking For</text>
    <text x="86" y="408" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Entry-level Software Engineer / ML Engineer roles</text>
