<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .row { opacity: 0; animation: fadeInUp 0.5s ease-out forwards; }
  </style>

  <rect width="900" height="400" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- Row 1: Education -->
  <g class="row" style="animation-delay:0.05s">
    <circle cx="46" cy="46" r="16" fill="#1c2540"/>
    <text x="46" y="52" font-size="15" text-anchor="middle">🎓</text>
    <text x="76" y="40" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Education</text>
    <text x="76" y="60" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">B.E. Artificial Intelligence &amp; Machine Learning — VSB Engineering College</text>
    <text x="76" y="78" font-family="Segoe UI, sans-serif" font-size="13.5" font-style="italic" fill="#6e7681">2023–2027 &#8202;·&#8202; CGPA 8.41</text>
  </g>
  <line x1="24" y1="94" x2="876" y2="94" stroke="#21262d"/>

  <!-- Row 2: Focus -->
  <g class="row" style="animation-delay:0.12s">
    <circle cx="46" cy="124" r="16" fill="#2a1c40"/>
    <text x="46" y="130" font-size="15" text-anchor="middle">🧭</text>
    <text x="76" y="118" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Focus</text>
    <text x="76" y="138" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Full-stack development (Java + React ecosystem)</text>
    <text x="76" y="156" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">with applied Machine Learning</text>
  </g>
  <line x1="24" y1="172" x2="876" y2="172" stroke="#21262d"/>

  <!-- Row 3: Internships -->
  <g class="row" style="animation-delay:0.19s">
    <circle cx="46" cy="198" r="16" fill="#1c3a2e"/>
    <text x="46" y="204" font-size="15" text-anchor="middle">🏢</text>
    <text x="76" y="192" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Internships</text>
    <text x="76" y="212" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Infosys Internship 5.0 &#8202;·&#8202; ServiceNow University</text>
  </g>
  <line x1="24" y1="228" x2="876" y2="228" stroke="#21262d"/>

  <!-- Row 4: Flagship project -->
  <g class="row" style="animation-delay:0.26s">
    <circle cx="46" cy="256" r="16" fill="#1c3a2e"/>
    <text x="46" y="262" font-size="15" text-anchor="middle">✅</text>
    <text x="76" y="250" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Flagship Project</text>
    <text x="76" y="270" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">MarketMind — a completed AI startup-validation SaaS</text>
    <text x="76" y="288" font-family="Segoe UI, sans-serif" font-size="13.5" font-style="italic" fill="#6e7681">LangGraph + FastAPI + Next.js</text>
  </g>
  <line x1="24" y1="304" x2="876" y2="304" stroke="#21262d"/>

  <!-- Row 5: Looking for -->
  <g class="row" style="animation-delay:0.33s">
    <circle cx="46" cy="332" r="16" fill="#3a1c2e"/>
    <text x="46" y="338" font-size="15" text-anchor="middle">🎯</text>
    <text x="76" y="326" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Looking For</text>
    <text x="76" y="346" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8b949e">Entry-level Software Engineer / ML Engineer roles</text>
  </g>
</svg>
